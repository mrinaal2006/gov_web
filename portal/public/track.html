<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track a Complaint</title>
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/site.js" defer></script>
</head>
<body data-page="track">
<header class="top"><div class="wrap">
  <a class="brand" href="/index.html"><img class="logo" src="/assets/logo.svg" alt="" width="36" height="36"><span data-service>Samasya Radar</span></a>
  <nav>
    <a href="/file.html" data-t="nav_file"></a>
    <a href="/privacy.html" data-t="nav_privacy"></a>
    <button class="btn alt small" id="lang" data-t="switch_lang" type="button"></button>
  </nav>
</div></header>
<main><div class="wrap narrow">
  <section class="panel">
    <h1 data-t="track_title"></h1>
    <form id="lookup">
      <label for="tid" data-t="id_label"></label>
      <input type="text" id="tid" required maxlength="20" autocomplete="off" placeholder="SR-XXXXXXXXXX">
      <button class="btn" style="margin-top:14px" data-t="track_btn"></button>
    </form>
    <div class="error" id="error" role="alert" hidden></div>
  </section>
  <section class="panel" id="result" hidden></section>
</div></main>
<footer><div class="wrap foot-bottom" style="border:0;margin:0;padding-top:0"><span data-copyright></span><span id="operator"></span></div></footer>
</body>
</html>
