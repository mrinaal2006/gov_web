<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samasya Radar | Report and Track Local Problems</title>
<meta name="description" content="Report local problems in Bengali, English or Banglish, and track the response with your tracking ID.">
<meta name="theme-color" content="#07332f">
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/site.js" defer></script>
</head>
<body data-page="home">
<a class="skip" href="#main" data-t="skip"></a>
<header class="top"><div class="wrap">
  <a class="brand" href="/index.html"><img class="logo" src="/assets/logo.svg" alt="" width="40" height="40"><span data-service>Samasya Radar</span></a>
  <nav aria-label="Main">
    <a href="#how" data-t="nav_how"></a>
    <a href="#report" data-t="nav_topics"></a>
    <a href="/track.html" data-t="nav_track"></a>
    <button class="btn alt small" id="lang" data-t="switch_lang" type="button"></button>
    <a class="btn small" href="/file.html" data-t="nav_file"></a>
  </nav>
</div></header>

<main id="main">
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <p class="eyebrow" data-t="eyebrow"></p>
        <h1 data-t="home_title"></h1>
        <p class="hero-lead" data-t="home_lead"></p>
        <div class="actions">
          <a class="btn accent large" href="/file.html" data-t="home_file"></a>
          <a class="btn ghost large" href="/track.html" data-t="home_track"></a>
        </div>
        <ul class="langs" aria-label="Languages">
          <li>বাংলা</li><li>English</li><li>Banglish</li>
        </ul>
      </div>
    </div>
  </section>

  <div class="wrap">
    <form class="quick" id="quick" role="search">
      <div>
        <label for="quick-id" data-t="quick_title"></label>
        <span class="hint" data-t="quick_hint"></span>
      </div>
      <div class="quick-row">
        <input type="text" id="quick-id" required maxlength="20" autocomplete="off" placeholder="SR-XXXXXXXXXX">
        <button class="btn" data-t="track_btn"></button>
      </div>
    </form>
  </div>

  <section class="section" id="how">
    <div class="wrap">
      <p class="kicker" data-t="how_kicker"></p>
      <h2 data-t="how_title"></h2>
      <ol class="flow">
        <li><span class="num">1</span><h3 data-t="step1"></h3><p data-t="step1_d"></p></li>
        <li><span class="num">2</span><h3 data-t="step2"></h3><p data-t="step2_d"></p></li>
        <li><span class="num">3</span><h3 data-t="step3"></h3><p data-t="step3_d"></p></li>
      </ol>
    </div>
  </section>

  <section class="section tint" id="report">
    <div class="wrap">
      <p class="kicker" data-t="topics_kicker"></p>
      <h2 data-t="topics_title"></h2>
      <ul class="topics">
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3s6.5 7 6.5 11.5a6.5 6.5 0 0 1-13 0C5.5 10 12 3 12 3z"/></svg><div><h3 data-t="t_water"></h3><p data-t="t_water_d"></p></div></li>
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 5 14h6l-1 8 8-12h-6z"/></svg><div><h3 data-t="t_power"></h3><p data-t="t_power_d"></p></div></li>
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3 4 21M16 3l4 18M12 4v3M12 11v3M12 18v3"/></svg><div><h3 data-t="t_roads"></h3><p data-t="t_roads_d"></p></div></li>
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg><div><h3 data-t="t_health"></h3><p data-t="t_health_d"></p></div></li>
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1.2 12H7.2zM9 8V6a3 3 0 0 1 6 0v2"/></svg><div><h3 data-t="t_ration"></h3><p data-t="t_ration_d"></p></div></li>
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 11h18M7 15h3"/></svg><div><h3 data-t="t_pension"></h3><p data-t="t_pension_d"></p></div></li>
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14M9 8V5h6v3M7 8l1 12h8l1-12M10.5 12v4M13.5 12v4"/></svg><div><h3 data-t="t_clean"></h3><p data-t="t_clean_d"></p></div></li>
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 9.5 12 5l9.5 4.5L12 14zM6.5 12v4.5c3.5 2.6 7.5 2.6 11 0V12"/></svg><div><h3 data-t="t_school"></h3><p data-t="t_school_d"></p></div></li>
      </ul>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <p class="kicker" data-t="why_kicker"></p>
      <h2 data-t="why_title"></h2>
      <div class="values">
        <div><h3 data-t="v1"></h3><p data-t="v1_d"></p></div>
        <div><h3 data-t="v2"></h3><p data-t="v2_d"></p></div>
        <div><h3 data-t="v3"></h3><p data-t="v3_d"></p></div>
      </div>
    </div>
  </section>

  <div class="wrap"><p class="alert" data-t="emergency"></p></div>

  <section class="closing">
    <div class="wrap closing-row">
      <div><h2 data-t="closing_title"></h2><p data-t="closing_d"></p></div>
      <a class="btn accent large" href="/file.html" data-t="home_file"></a>
    </div>
  </section>
</main>

<footer class="site">
  <div class="wrap">
    <div class="foot-grid">
      <div class="foot-brand">
        <a class="brand" href="/index.html"><img class="logo" src="/assets/logo.svg" alt="" width="36" height="36"><span data-service>Samasya Radar</span></a>
        <p data-t="foot_about"></p>
      </div>
      <nav aria-label="Citizens">
        <h3 data-t="foot_citizens"></h3>
        <a href="/file.html" data-t="nav_file"></a>
        <a href="/track.html" data-t="nav_track"></a>
      </nav>
      <nav aria-label="Service">
        <h3 data-t="foot_service"></h3>
        <a href="/privacy.html" data-t="nav_privacy"></a>
        <a href="/officer.html" data-t="foot_officer"></a>
      </nav>
    </div>
    <div class="foot-bottom"><span data-copyright></span><span id="operator"></span></div>
  </div>
</footer>
</body>
</html>
